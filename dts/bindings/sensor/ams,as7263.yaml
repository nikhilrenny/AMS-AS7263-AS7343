# AS7263 6-channel NIR spectral sensor devicetree binding.
# Proprietary and confidential. Not for public distribution.

description: |
  AMS AS7263 6-channel NIR spectral sensor (610/680/730/760/810/860 nm).
  I2C, fixed 7-bit address 0x49. Accessed via the polled AS726x virtual-
  register protocol, not direct register addressing. Not SparkFun-specific.

compatible: "ams,as7263"

include: [i2c-device.yaml]

properties:
  gain:
    type: int
    default: 3
    description: Default GAIN (0=1x, 1=3.7x, 2=16x, 3=64x).

  int-time:
    type: int
    default: 166
    description: Default INT_T register value; integration time = value * 2.8ms.

  led-present:
    type: boolean
    description: Set if an external LED is wired to LED_DRV.
    